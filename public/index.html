<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BskyAlt - Bluesky-like Client</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="theme-dark">
    <header class="topbar">
      <div class="brand">BskyAlt</div>
      <button id="themeToggle" aria-label="Toggle theme">🌗</button>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <nav>
          <a href="#" data-section="feeds" class="link active">Feeds</a>
          <a href="#" data-section="posts" class="link">Posts</a>
          <a href="#" data-section="dm" class="link">DMs</a>
          <a href="#" data-section="profile" class="link">Profile</a>
          <a href="#" data-section="pds" class="link">PDS</a>
        </nav>
      </aside>
      <main class="content">
        <section id="feeds" class="section">
          <h2>Feeds</h2>
          <div id="feedList" class="cards"></div>
        </section>
        <section id="posts" class="section" hidden>
          <h2>New Post</h2>
          <textarea id="postContent" placeholder="What's on your mind?" rows="4"></textarea>
          <div class="controls">
            <button id="postBtn">Post</button>
            <span id="postStatus" class="status"></span>
          </div>
        </section>
        <section id="dm" class="section" hidden>
          <h2>Direct Messages</h2>
          <div id="dmList" class="cards"></div>
          <div class="card composer">
            <textarea id="dmInput" placeholder="Write a message..." rows="3"></textarea>
            <button id="dmSend">Send</button>
          </div>
        </section>
        <section id="profile" class="section" hidden>
          <h2>Profile</h2>
          <div id="profileView" class="card"></div>
        </section>
        <section id="pds" class="section" hidden>
          <h2>Personal Bluesky Session</h2>
          <div class="card">
            <label>Base Bluesky API URL</label>
            <input id="baseUrl" value="https://public.bsky.social" />
            <label>Access Token</label>
            <input id="token" type="password" placeholder="Bearer token" />
            <button id="saveConfig">Save</button>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
